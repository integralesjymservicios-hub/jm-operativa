<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J&amp;M Operativa</title>
<meta name="theme-color" content="#29166F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="J&amp;M">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Identidad J&M: morado #29166F (principal) y rosa #DD127B (acento). */
:root{
  --bg:#f3f1f8;--surface:#fff;--sunk:#ebe8f3;--ink:#1b1430;--muted:#5f5875;--line:#ddd8ea;
  --brand:#29166F;--brand-ink:#fff;--brand-soft:#e9e5f5;--pink:#DD127B;--pink-soft:#fde4f0;
  --ok:#1d7436;--ok-soft:#dff1e3;--warn:#9a5700;--warn-soft:#fbecd3;--bad:#b42318;--bad-soft:#fbe3e0;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;--f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root{
  --bg:#110d1d;--surface:#1a1430;--sunk:#231c3d;--ink:#ece8f7;--muted:#a59dc0;--line:#332a52;
  --brand:#9d8cf0;--brand-ink:#140c2e;--brand-soft:#2b2250;--pink:#ff5fa8;--pink-soft:#3d1428;
  --ok:#62c981;--ok-soft:#14301c;--warn:#f1a945;--warn-soft:#33250e;--bad:#f7766b;--bad-soft:#3a1714;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
a{color:var(--brand)}
.top{position:sticky;top:0;z-index:5;background:#29166F;color:#fff;padding-top:env(safe-area-inset-top,0px)}
.top-in,.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:12px;padding-block:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand img{height:38px;width:auto;display:block}
.brand b{font:700 17px/1.1 var(--f-display);display:block;color:#fff}
.brand small{color:#cfc7ef;font-size:12px}
.top .btn.ghost{color:#fff}
.top .btn.ghost:hover{background:rgb(255 255 255/.12)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;font-weight:600;font-size:14px;color:#cfc7ef;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-current="page"]{color:#fff;border-bottom-color:#DD127B}
main.wrap{padding-block:18px calc(60px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}.small{font-size:13px}.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:19px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pink{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.big{padding:14px 18px;font-size:16px;width:100%}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0;flex:1 1 140px}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=password],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px;font-weight:400;color:var(--ink);width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
.mono{font-family:var(--f-mono)}
.code{font:600 13px var(--f-mono);background:var(--sunk);padding:2px 7px;border-radius:5px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.chk{display:flex;gap:8px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:14px}
.chk input{accent-color:var(--brand);width:18px;height:18px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--pink-soft);color:var(--pink)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-run{background:var(--brand-soft);color:var(--brand)}.p-none{background:var(--sunk);color:var(--muted)}
.chip{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--sunk);font-size:12px}
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-top:8px}
.hero img{width:150px;height:auto}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:0 auto;width:100%}
.pinpad button{padding:16px 0;font:700 22px var(--f-display);border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink)}
.pinpad button:active{background:var(--brand-soft)}
.pindots{display:flex;gap:12px;justify-content:center;padding:6px 0}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.pindots i.on{background:var(--pink);border-color:var(--pink)}
.ronda-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ronda-head h2{font-size:22px;color:var(--brand)}
.count{font:800 34px/1 var(--f-display);color:var(--brand)}
.count small{font-size:16px;color:var(--muted);font-weight:600}
.prog{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--pink));border-radius:999px}
.pts{list-style:none;margin:0;padding:0}
.pts li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pts li:first-child{border-top:0}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700}
.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.pts b{font-weight:600;display:block}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.how div{background:var(--brand-soft);border-radius:10px;padding:12px;font-size:14px}
.how b{display:block;font-family:var(--f-display);margin-bottom:2px;color:var(--brand)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .v{font:800 28px/1.1 var(--f-display);color:var(--brand)}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,1fr)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;color:var(--ink);font:inherit}
.tile:hover{border-color:var(--brand)}
.tile h3{font-size:17px;color:var(--brand)}
.back{align-self:flex-start}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.subtabs button[aria-current="page"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.li:first-child{border-top:0}
.li .t{font-weight:600;min-width:0}
.li .s{grid-column:1/-1;font-size:13px;color:var(--muted)}
.li.click{cursor:pointer}
.detail{grid-column:1/-1;background:var(--sunk);border-radius:9px;padding:10px 12px;font-size:14px;overflow-x:auto}
.detail table{width:100%;border-collapse:collapse}
.detail td{padding:4px 6px 4px 0}
.prow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.prow:first-child{border-top:0}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.label{border:1px dashed var(--line);border-radius:9px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;min-width:0}
.qr{width:140px;height:140px}
.label .u{font:10px var(--f-mono);color:var(--muted);word-break:break-all;user-select:all}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:700 17px var(--f-display);margin-bottom:4px}
.banner{padding:10px 14px;border-radius:9px;font-size:14px}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-info{background:var(--brand-soft);color:var(--ink)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.pinshow{font:700 18px var(--f-mono);letter-spacing:.15em;color:var(--brand)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgb(0 0 0/.25)}
.toast.ok{background:var(--ok);color:#fff}.toast.bad{background:var(--bad);color:#fff}
.regbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.regbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:var(--ink);font:inherit}
.regbtn:hover{border-color:var(--brand)}
.regbtn b{font:700 16px var(--f-display);color:var(--brand)}
.regbtn span{font-size:13px;color:var(--muted)}
.k-Parte{background:var(--brand-soft);color:var(--brand)}.k-Visita{background:var(--pink-soft);color:var(--pink)}.k-Incidencia{background:var(--warn-soft);color:var(--warn)}
.matriz{overflow-x:auto}
.matriz table{border-collapse:collapse;width:100%;min-width:480px;font-size:14px}
.matriz th{font-size:12px;color:var(--muted);font-weight:600;text-align:center;padding:6px 4px}
.matriz th:first-child,.matriz td:first-child{text-align:left}
.matriz td{border-top:1px solid var(--line);padding:8px 4px;text-align:center}
.matriz input{accent-color:var(--brand);width:20px;height:20px}
.linkbox{font:12px var(--f-mono);background:var(--sunk);padding:8px 10px;border-radius:8px;word-break:break-all;user-select:all}
.fotos-p{display:flex;gap:8px;flex-wrap:wrap}
.fotos-p img{width:120px;height:120px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.zoom{position:fixed;inset:0;background:rgb(0 0 0/.85);z-index:30;display:grid;place-items:center;padding:16px}
.zoom img{max-width:100%;max-height:100%;border-radius:8px}
.fechas{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--sunk);padding:8px;border-radius:10px}
.fechas button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink)}
.fechas button[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#fff}
.fechas input{width:auto;padding:6px 8px;font-size:13px}
.fechas .lbl{font-size:12px;color:var(--muted);flex-basis:100%}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
details summary{cursor:pointer}
</style>
</head>

/* ---------- utilidades ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return String(n).padStart(2,'0')}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dayOf(iso){if(!iso)return'';if(/^\d{4}-\d{2}-\d{2}$/.test(iso))return iso;var d=new Date(iso);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fT(iso){return iso?new Date(iso).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}):'—'}
function fD(s){if(!s)return'';var d=String(s).length===10?new Date(s+'T12:00:00'):new Date(s);return isNaN(d)?String(s):d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'})}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function nowIso(){return new Date().toISOString()}
function toast(m,k){var b=document.getElementById('toastBox');b.innerHTML='<div class="toast '+(k||'')+'" role="status">'+esc(m)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(function(){b.innerHTML=''},4000)}
function appMsg(e){var m=/APP:(.*)/.exec(String(e&&e.message||e||''));return m?m[1]:null}
/* Llama al servidor (tu Apps Script) por su API. Sin señal, falla y la app guarda en el móvil. */
function call(fn){var args=[].slice.call(arguments,1);
  if(!CFG.api||/PEGA_AQUI/.test(CFG.api))return Promise.reject(new Error('APP:Falta configurar la dirección del servidor en config.js.'));
  var ctl=typeof AbortController!=='undefined'?new AbortController():null,t=setTimeout(function(){if(ctl)ctl.abort()},30000);
  return fetch(CFG.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),signal:ctl?ctl.signal:undefined,redirect:'follow'})
    .then(function(r){return r.json()}).then(function(j){clearTimeout(t);if(!j.ok)throw new Error(j.error||'Error');return j.data})
    .catch(function(e){clearTimeout(t);throw e})}
/* Tareas de un parte: las nuevas van separadas por « | »; las antiguas, por comas (y hay tareas que llevan coma). */
function tareasLista(s){s=String(s||'').trim();if(!s)return[];if(s.indexOf(' | ')>=0)return s.split(' | ');
  var cand=TAREAS_DEF.slice();((OF&&OF.com)||(B&&B.com)||[]).forEach(function(c){[].concat(Array.isArray(c.tareasLista)?c.tareasLista:Array.isArray(c.tareas)?c.tareas:[]).forEach(function(t){if(cand.indexOf(t)<0)cand.push(t)})});
  cand.sort(function(a,b){return b.length-a.length});var out=[];
  while(s){var t=cand.find(function(c){return s.indexOf(c)===0&&(s.length===c.length||s.substr(c.length,2)===', ')});
    if(!t){var i=s.indexOf(', ');t=i<0?s:s.slice(0,i)}out.push(t);s=s.slice(t.length).replace(/^, /,'')}
  return out}
function ptsOf(cid,list){return(list||(B&&B.pts)||[]).filter(function(p){return p.comunidadId===cid}).sort(function(a,b){return(a.orden||0)-(b.orden||0)})}
function comName(cid,list){var c=(list||(B&&B.com)||[]).find(function(x){return x.id===cid});return c?c.nombre:'Comunidad'}

/* ---------- registro de puntos ---------- */
function cierreOlvido(){
  if(!RON)return;var ult=RON.lecturas.reduce(function(m,l){return l.ts>m?l.ts:m},RON.inicio);
  if(Date.now()-new Date(ult).getTime()>HORAS_OLVIDO*3600000){RON.fin=ult;dirty(RON);RON=null;saveRon();toast('Tu ronda anterior se ha cerrado sola por llevar '+HORAS_OLVIDO+' horas sin actividad.')}
}
function scan(code,metodo){
  code=String(code||'').trim().toUpperCase();
  if(!SES||!B){S.pending=code;render();return}
  cierreOlvido();
  var p=B.pts.find(function(x){return String(x.codigo).toUpperCase()===code});
  if(!p){toast('El punto '+code+' no existe o no es de una comunidad que tengas asignada.','bad');return}
  if(RON&&RON.comunidadId!==p.comunidadId){toast('Tienes una ronda abierta en '+comName(RON.comunidadId)+'. Termínala antes de empezar otra.','bad');return}
  var prev=RON&&RON.lecturas.find(function(l){return l.puntoId===p.id});
  if(prev){toast(p.nombre+' ya estaba registrado a las '+fT(prev.ts)+'.');return}
  var nueva=!RON,ts=nowIso();
  if(!RON)RON={id:newId(),comunidadId:p.comunidadId,inicio:ts,fin:null,lecturas:[]};
  RON.lecturas.push({puntoId:p.id,codigo:p.codigo,ts:ts,metodo:metodo});
  saveRon();dirty(RON);render();
  /* Queda apuntado en el móvil al instante; el envío va por detrás y solo avisa si algo falla */
  toast((nueva?'Ronda iniciada · ':'')+'✓ '+p.nombre+' registrado a las '+fT(ts),'ok');
  if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}
  flush().then(function(ok){
    if(!ok&&S.qErr)toast(S.qErr,'bad');
    else if(!ok)toast('Sin cobertura: '+p.nombre+' queda guardado en el móvil. Se enviará al volver la señal.');
  });
}
function dirty(r){OUT.rondas[r.id]=JSON.parse(JSON.stringify(r));saveOut()}
function endRonda(){if(!RON)return;RON.fin=nowIso();dirty(RON);RON=null;saveRon();render();toast('Ronda terminada','ok');
  flush().then(function(ok){if(!ok)toast(S.qErr||'Sin cobertura: la ronda queda cerrada en el móvil y se enviará al volver la señal.',S.qErr?'bad':'')})}
function pendientes(){return Object.keys(OUT.rondas).length+OUT.partes.length+OUT.otros.length}

var flushing=null;
function flush(){
  if(flushing)return flushing;
  flushing=(async function(){
    if(!SES)return false;
    var auth={trabId:SES.trabId,pin:SES.pin};
    for(var id of Object.keys(OUT.rondas)){
      var snap=JSON.stringify(OUT.rondas[id]);
      try{await call('sincronizarRonda',auth,JSON.parse(snap))}catch(e){return fail(e)}
      var sent=JSON.parse(snap);
      if(RON&&RON.id===id){RON.lecturas.forEach(function(l){if(sent.lecturas.some(function(x){return x.puntoId===l.puntoId}))l.env=1});saveRon()}
      if(OUT.rondas[id]&&JSON.stringify(OUT.rondas[id])===snap){delete OUT.rondas[id];saveOut()}
    }
    for(var p of OUT.partes.slice()){
      try{await call('guardarParte',auth,p)}catch(e){return fail(e)}
      OUT.partes=OUT.partes.filter(function(x){return x.id!==p.id});saveOut();
    }
    for(var o of OUT.otros.slice()){
      try{await call(o.kind==='visita'?'guardarVisita':'guardarIncidencia',auth,o.data)}catch(e){return fail(e)}
      OUT.otros=OUT.otros.filter(function(x){return x.data.id!==o.data.id});saveOut();
    }
    S.qErr=null;return true;
  })();
  return flushing.finally(function(){flushing=null;render()});
}
function fail(e){var m=appMsg(e);if(m)S.qErr=m;return false}

/* ---------- entrada ---------- */
function pinKey(k){
  if(k==='del'){S.pin=S.pin.slice(0,-1);render();return}
  if(S.pin.length>=4)return;S.pin+=k;render();
  if(S.pin.length===4){var pin=S.pin;S.busy=true;render();
    call('entrar',{dni:S.dni,pin:pin}).then(function(b){SES={trabId:b.trab.id,pin:b.trab.pin,nombre:b.trab.nombre};jset('jm_ses',SES);aplicarBoot(b);S.view='trab';S.pin='';S.dni='';S.paso='dni';S.busy=false;render();
      if(S.pending){var c=S.pending;S.pending=null;scan(c,'enlace')}else flush()})
    .catch(function(e){S.busy=false;S.pin='';render();toast(appMsg(e)||'Sin conexión. Necesitas señal para entrar.','bad')})}
}
function aplicarBoot(b){
  B={com:b.com,pts:b.pts,recientes:b.recientes||[],tipos:b.tipos||[]};jset('jm_boot',B);
  var ab=b.abierta;
  if(ab&&!(OUT.rondas[ab.id]&&OUT.rondas[ab.id].fin)){
    if(!RON){RON=ab;RON.lecturas.forEach(function(l){l.env=1})}
    else if(RON.id===ab.id){ab.lecturas.forEach(function(l){if(!RON.lecturas.some(function(x){return x.puntoId===l.puntoId}))RON.lecturas.push(Object.assign({env:1},l))})}
    saveRon();
  }
}
function refrescar(){if(!SES)return;call('entrar',{trabId:SES.trabId,pin:SES.pin}).then(function(b){aplicarBoot(b);render();
    if(S.pending){var c=S.pending;S.pending=null;scan(c,'enlace')}else flush()})
  .catch(function(e){var m=appMsg(e);if(m){SES=null;jset('jm_ses',null);S.view='login';render();toast(m,'bad')}})}
function salir(){if(pendientes()){toast('Tienes registros sin enviar. Espera a tener señal antes de salir.','bad');return}
  SES=null;B=null;RON=null;jset('jm_ses',null);jset('jm_boot',null);jset('jm_ronda',null);S.view='login';S.paso='dni';S.pin='';render()}

/* ---------- vistas: trabajador ---------- */
function vLogin(){
  var h='<div class="hero"><img src="'+LOGO+'" alt="J&amp;M"><h1 style="font-size:22px;color:var(--brand)">Operativa</h1></div>';
  if(S.pending)h+='<div class="banner b-info">Has escaneado el punto <span class="code">'+esc(S.pending)+'</span>. Entra y se registrará.</div>';
  if(S.paso==='dni')return h+'<section class="card stack" style="max-width:420px;margin:0 auto;width:100%"><div><div class="eyebrow">Entrada</div><h2>Escribe tu DNI</h2></div>'+
    '<form class="stack" data-form="dni" autocomplete="off"><label class="f">DNI o NIE<input type="text" id="dniIn" placeholder="12345678Z" autocapitalize="characters" class="mono" style="text-transform:uppercase"></label><button class="btn pri big">Continuar</button></form>'+
    '<p class="small muted" style="margin:0">La primera vez necesitas señal. Después el móvil te recuerda.</p></section>'+
    '<div class="row" style="justify-content:center;gap:6px"><button class="btn small" data-act="goCli">Acceso clientes</button><button class="btn ghost small" data-act="goOfi">Acceso oficina</button></div>';
  return h+'<section class="card stack" style="max-width:420px;margin:0 auto;width:100%;text-align:center"><div><div class="eyebrow">DNI '+esc(S.dni)+'</div><h2>Escribe tu PIN</h2></div>'+
    '<div class="pindots">'+[0,1,2,3].map(function(i){return'<i class="'+(i<S.pin.length?'on':'')+'"></i>'}).join('')+'</div>'+
    (S.busy?'<p class="muted" style="margin:0">Comprobando…</p>':'')+
    '<div class="pinpad">'+['1','2','3','4','5','6','7','8','9','','0','del'].map(function(k){return k?'<button data-act="pin" data-k="'+k+'" aria-label="'+(k==='del'?'Borrar':k)+'">'+(k==='del'?'⌫':k)+'</button>':'<span></span>'}).join('')+'</div>'+
    '<button class="btn ghost" data-act="otroDni">Cambiar DNI</button></section>';
}
function vTrab(){
  if(!B)return'<div class="card empty"><b>Cargando tus datos…</b>Necesitas señal la primera vez.</div>';
  if(!B.com.length)return'<div class="card empty"><b>No tienes comunidades asignadas</b>Pide a la oficina que te asigne las comunidades en las que trabajas.</div>';
  var n=pendientes(),h='';
  if(S.qErr)h+='<div class="banner b-bad">'+esc(S.qErr)+' Hay '+n+' registro'+(n===1?'':'s')+' guardado'+(n===1?'':'s')+' en el móvil. Habla con la oficina.</div>';
  else if(n)h+='<div class="banner b-warn"><b>Sin cobertura.</b> '+n+' registro'+(n===1?'':'s')+' guardado'+(n===1?'':'s')+' en el móvil con su hora. Se enviarán solos cuando vuelva la señal.</div>';
  else if(S.offline)h+='<div class="banner b-warn"><b>Sin cobertura.</b> Escribe el código impreso en cada etiqueta: se guarda en el móvil. Sin señal, el QR y el NFC no pueden abrir la app.</div>';
  if(RON){
    var pts=ptsOf(RON.comunidadId),read={};RON.lecturas.forEach(function(l){read[l.puntoId]=l});
    var leidos=Object.keys(read).length,total=pts.length,full=total&&leidos>=total;
    h+='<section class="card stack"><div class="ronda-head"><div><div class="eyebrow">Ronda en curso · desde '+fT(RON.inicio)+'</div><h2>'+esc(comName(RON.comunidadId))+'</h2></div>'+
      '<div class="count num">'+leidos+'<small> / '+total+' puntos</small></div></div>'+
      '<div class="prog"><i style="width:'+(total?Math.round(leidos/total*100):0)+'%"></i></div>'+
      '<ul class="pts">'+pts.map(function(p,i){var l=read[p.id];return'<li class="'+(l?'done':'')+'"><span class="dot">'+(l?'✓':i+1)+'</span><span><b>'+esc(p.nombre)+'</b><span class="mono small muted">'+esc(p.codigo)+'</span></span>'+
        '<span class="small num" style="'+(l&&!l.env?'color:var(--warn)':l?'':'color:var(--muted)')+'">'+(l?fT(l.ts)+(l.env?' · enviado':' · en el móvil'):'Pendiente')+'</span></li>'}).join('')+'</ul>'+
      codeForm()+
      '<button class="btn big '+(full?'pink':'')+'" data-act="end">'+(full?'Terminar ronda':'Terminar ronda con '+(total-leidos)+' punto'+(total-leidos===1?'':'s')+' sin leer')+'</button></section>';
  }else{
    var coms=B.com.filter(function(c){return ptsOf(c.id).length});
    h+='<section class="card stack"><div><div class="eyebrow">Sin ronda abierta</div><h2>Empieza en el primer punto</h2></div>'+
      '<p style="margin:0">Escanea el QR o acerca el móvil a la etiqueta NFC del primer punto. La ronda empieza sola.</p>'+codeForm()+
      (coms.length?'<details><summary class="small muted">Empezar sin escanear</summary><div class="row" style="margin-top:10px"><label class="f">Comunidad<select id="startCom">'+coms.map(function(c){return'<option value="'+c.id+'">'+esc(c.nombre)+'</option>'}).join('')+'</select></label><button class="btn" data-act="start" style="align-self:flex-end">Empezar ronda</button></div></details>':'')+
      '</section>';
  }
  h+='<section class="how"><div><b>Con QR</b>Abre la cámara del móvil, apunta a la etiqueta y toca el enlace.</div><div><b>Con NFC</b>Acerca la parte de atrás del móvil a la etiqueta y toca el aviso.</div><div><b>Sin señal o etiqueta dañada</b>Escribe el código impreso bajo el QR. Se guarda y se envía después.</div></section>';
  h+=vRegistros();
  return h;
}
function codeForm(){return'<form class="row" data-form="code" autocomplete="off"><label class="f" style="flex:1 1 180px">Código del punto<input type="text" id="codeIn" placeholder="Ej. CHU2-03" class="mono" style="text-transform:uppercase" autocapitalize="characters"></label><button class="btn pri" style="align-self:flex-end">Registrar</button></form>'}
function comSelect(){
  var defCom=(RON&&RON.comunidadId)||(B.com[0]&&B.com[0].id)||'';
  var cur=S.pCom&&B.com.some(function(c){return c.id===S.pCom})?S.pCom:defCom;
  return{cur:cur,html:'<label class="f">Comunidad<select id="pCom">'+B.com.map(function(c){return'<option value="'+c.id+'" '+(c.id===cur?'selected':'')+'>'+esc(c.nombre)+'</option>'}).join('')+'</select></label>'};
}
function fotosInput(){return'<label class="f">Fotos (máximo 4)<input type="file" id="pFotos" accept="image/*" multiple><span class="small muted" style="font-weight:400">'+(S.fotos.length?S.fotos.length+' foto(s) preparada(s)':'Opcional')+'</span></label>'+
  (S.fotos.length?'<div class="thumbs">'+S.fotos.map(function(f){return'<img src="'+f+'" alt="Foto">'}).join('')+'</div>':'')}
function botonesForm(txt){return'<div class="row"><button class="btn pri" '+(S.busy?'disabled':'')+'>'+txt+'</button><button type="button" class="btn ghost" data-act="form" data-v="">Cancelar</button></div>'}
function horaAhora(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function formParte(){var cs=comSelect();
  return'<form class="stack" data-form="parte"><h3 style="font-size:17px;color:var(--brand)">Parte de trabajo</h3>'+
    '<div class="row">'+cs.html+'<label class="f">Fecha<input type="date" id="pFecha" value="'+today()+'"></label></div>'+
    '<div class="row"><label class="f">Entrada<input type="time" id="pIn" value="'+(RON?fT(RON.inicio):'')+'"></label><label class="f">Salida<input type="time" id="pOut"></label></div>'+
    '<div><div class="eyebrow" style="margin-bottom:6px">Tareas realizadas</div><div class="checks">'+tareasDe(cs.cur).map(function(t,i){return'<label class="chk"><input type="checkbox" id="pT'+i+'"> '+esc(t)+'</label>'}).join('')+'</div></div>'+
    '<label class="f">Observaciones e incidencias<textarea id="pObs" placeholder="Ej. Bombilla fundida en el rellano del 3º."></textarea></label>'+
    fotosInput()+botonesForm('Guardar parte')+'</form>'}
function formVisita(){var cs=comSelect(),tipos=(B.tipos&&B.tipos.length)?B.tipos:['Ascensores','Grupo de presión','Contra incendios','Paquetería / mensajería','Reforma u obra','Reparación','Otro'];
  return'<form class="stack" data-form="visita"><h3 style="font-size:17px;color:var(--brand)">Visita externa</h3><p class="small muted" style="margin:0">Anota quién ha venido a la comunidad que no sea de J&amp;M.</p>'+
    '<div class="row">'+cs.html+'<label class="f">Fecha<input type="date" id="vFecha" value="'+today()+'"></label><label class="f" style="flex:0 1 120px">Hora<input type="time" id="vHora" value="'+horaAhora()+'"></label></div>'+
    '<div class="row"><label class="f">Tipo<select id="vTipo">'+tipos.map(function(t){return'<option>'+esc(t)+'</option>'}).join('')+'</select></label><label class="f" style="flex:2 1 200px">Empresa o persona<input type="text" id="vEmp" placeholder="Ej. Orona, técnico Juan"></label></div>'+
    '<label class="f">Qué han venido a hacer<textarea id="vMot" placeholder="Ej. Revisión mensual del ascensor del portal 4."></textarea></label>'+
    '<label class="f">Dónde<input type="text" id="vLug" placeholder="Ej. Portal 4, cuarto de máquinas"></label>'+
    fotosInput()+botonesForm('Guardar visita')+'</form>'}
function formIncidencia(){var cs=comSelect();
  return'<form class="stack" data-form="incidencia"><h3 style="font-size:17px;color:var(--brand)">Incidencia</h3><p class="small muted" style="margin:0">Anota cualquier problema en la comunidad, aunque no haya hecho falta cambiar nada.</p>'+
    '<div class="row">'+cs.html+'<label class="f">Fecha<input type="date" id="iFecha" value="'+today()+'"></label><label class="f" style="flex:0 1 120px">Hora<input type="time" id="iHora" value="'+horaAhora()+'"></label></div>'+
    '<label class="f">Dónde<input type="text" id="iLug" placeholder="Ej. Portal 4 · 3º"></label>'+
    '<label class="f">Qué ha pasado<textarea id="iInc" placeholder="Ej. La puerta del portal da golpe al cerrar."></textarea></label>'+
    '<label class="f">Estado<select id="iEst"><option value="Resuelta">Resuelta</option><option value="Pendiente">Pendiente de arreglar</option></select></label>'+
    '<label class="chk"><input type="checkbox" id="iMat"'+(S.iMat?' checked':'')+'> Se ha cambiado o comprado material</label>'+
    (S.iMat?'<div class="row"><label class="f" style="flex:2 1 200px">Qué material<input type="text" id="iMatD" placeholder="Ej. Bombilla LED, manivela antipánico"></label><label class="f" style="flex:0 1 100px">Cantidad<input type="text" id="iCant" inputmode="numeric" value="1"></label></div>':'')+
    fotosInput()+botonesForm('Guardar incidencia')+'</form>'}
function vRegistros(){
  var f=S.form,body;
  if(f==='parte')body=formParte();else if(f==='visita')body=formVisita();else if(f==='incidencia')body=formIncidencia();
  else body='<div class="regbtns">'+[['parte','Parte de trabajo','Tareas, horas y fotos'],['visita','Visita externa','Quién ha venido a la comunidad'],['incidencia','Incidencia','Problemas, averías y material usado']].map(function(x){return'<button class="regbtn" data-act="form" data-v="'+x[0]+'"><b>'+x[1]+'</b><span>'+x[2]+'</span></button>'}).join('')+'</div>';
  var mine=(B.recientes||[]).slice(0,5);
  return'<section class="card stack"><div class="sec-h"><h2>Registros</h2><span class="small muted">'+fD(today())+'</span></div>'+body+
    (mine.length&&!f?'<div><div class="eyebrow" style="margin:6px 0 2px">Tus últimos registros</div><div class="list">'+mine.map(function(r){return'<div class="li"><span class="t">'+esc(r.comunidad)+'</span><span class="chip k-'+esc(r.k)+'">'+esc(r.k)+'</span><span class="s">'+fD(r.fecha)+' · '+esc(r.texto)+'</span></div>'}).join('')+'</div></div>':'')+'</section>';
}

/* ---------- vistas: oficina ---------- */
function vCliLogin(){return'<div class="hero"><img src="'+LOGO+'" alt="J&amp;M"></div><section class="card stack" style="max-width:420px;margin:0 auto;width:100%"><div><div class="eyebrow">Área de clientes</div><h2>Administradores y presidentes</h2></div>'+
  '<form class="stack" data-form="cliLogin" autocomplete="off"><label class="f">Tu móvil<input type="tel" id="cliMov" placeholder="600 000 000" inputmode="tel"></label><label class="f">PIN<input type="password" id="cliPin" inputmode="numeric" maxlength="4" placeholder="4 cifras"></label><button class="btn pri big" '+(S.busy?'disabled':'')+'>Entrar</button></form>'+
  '<p class="small muted" style="margin:0">Si no tienes PIN o lo has olvidado, contacta con J&amp;M.</p><button class="btn ghost" data-act="goLogin">Volver</button></section>'}
function vOfiLogin(){return'<div class="hero"><img src="'+LOGO+'" alt="J&amp;M"></div><section class="card stack" style="max-width:420px;margin:0 auto;width:100%"><div><div class="eyebrow">Oficina</div><h2>PIN de oficina</h2></div>'+
  '<form class="stack" data-form="ofi"><label class="f">PIN<input type="password" id="ofiPin" inputmode="numeric" autocomplete="off"></label><button class="btn pri" '+(S.busy?'disabled':'')+'>Entrar</button></form>'+
  '<p class="small muted" style="margin:0">El PIN está en la pestaña Config de la hoja J&amp;M Operativa.</p><button class="btn ghost" data-act="goLogin">Volver</button></section>'}
function lectOf(rid){var D=OF.det,l=D&&D.lecturas?D.lecturas.filter(function(x){return x.rondaId===rid}):[];return l.length?l:OF.lecturas.filter(function(x){return x.rondaId===rid})}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function rangoDe(k,dia){var h=new Date(),a=function(n){var x=new Date();x.setDate(x.getDate()-n);return ymd(x)};
  if(k==='hoy')return{k:k,desde:ymd(h),hasta:ymd(h)};if(k==='ayer')return{k:k,desde:a(1),hasta:a(1)};if(k==='30')return{k:k,desde:a(29),hasta:ymd(h)};
  if(k==='dia'&&dia)return{k:k,desde:dia,hasta:dia};return{k:'7',desde:a(6),hasta:ymd(h)}}
function barraFechas(ctx,r){var opt=[['hoy','Hoy'],['ayer','Ayer'],['7','Últimos 7 días'],['30','Últimos 30 días']];
  var txt=r.k==='dia'?fD(r.desde):r.desde===r.hasta?fD(r.desde):fD(r.desde)+' – '+fD(r.hasta);
  return'<div class="fechas" role="group" aria-label="Fechas">'+opt.map(function(o){return'<button data-act="rango" data-ctx="'+ctx+'" data-v="'+o[0]+'" aria-pressed="'+(r.k===o[0])+'">'+o[1]+'</button>'}).join('')+
    '<label class="small muted" style="display:flex;gap:6px;align-items:center">Un día:<input type="date" id="'+ctx+'Dia" data-ctx="'+ctx+'" value="'+(r.k==='dia'?r.desde:'')+'" max="'+today()+'"></label>'+
    '<span class="lbl">Mostrando: '+esc(txt)+' · Las incidencias pendientes se muestran siempre · Las fechas de hace más de 2 meses se buscan en el archivo y tardan un poco más</span></div>'}
function estadoPill(r){return r.estado==='En curso'?'<span class="pill p-run">En curso '+r.leidos+'/'+r.total+'</span>':r.estado==='Completa'?'<span class="pill p-ok">Completa '+r.leidos+'/'+r.total+'</span>':'<span class="pill p-warn">Incompleta '+r.leidos+'/'+r.total+'</span>'}
function vOfi(){
  if(!OF)return'<div class="card empty"><b>Cargando…</b></div>';
  if(S.tab==='equipo')return S.trabSel?vTrabDet():vEquipo();
  if(S.tab==='clientes')return S.cliSel?vCliDet():vClientes();
  if(S.tab==='importar')return vImportar();
  return S.comSel?vComDet():vComs();
}
function vComs(){
  var hoy=OF.rondas.filter(function(r){return dayOf(r.inicio)===today()});
  return'<div class="kpis num"><div class="kpi"><div class="v">'+hoy.length+'</div><div class="l">Rondas hoy</div></div><div class="kpi"><div class="v">'+hoy.filter(function(r){return r.estado==='Completa'}).length+'</div><div class="l">Completas hoy</div></div>'+
    '<div class="kpi"><div class="v">'+OF.rondas.filter(function(r){return r.estado==='En curso'}).length+'</div><div class="l">En curso ahora</div></div><div class="kpi"><div class="v">'+OF.partes.filter(function(p){return dayOf(p.fecha)===today()}).length+'</div><div class="l">Partes hoy</div></div></div>'+
  '<div class="sec-h"><h2>Comunidades</h2>'+(OF.carpeta?'<a class="small" href="'+esc(OF.carpeta)+'" target="_blank" rel="noopener">Carpeta de hojas en Drive</a>':'')+'</div>'+
  (OF.com.length?'<div class="grid">'+OF.com.map(function(c){var r=OF.rondas.find(function(x){return x.comunidadId===c.id});var ph=OF.partes.filter(function(p){return p.comunidadId===c.id&&dayOf(p.fecha)===today()}).length;
      return'<button class="tile" data-act="com" data-id="'+c.id+'"><h3>'+esc(c.nombre)+'</h3><span class="small muted">'+esc(c.localidad||'')+(c.localidad?' · ':'')+ptsOf(c.id,OF.pts).length+' puntos</span>'+
      '<span class="row" style="gap:6px">'+(r?estadoPill(r)+(dayOf(r.inicio)!==today()&&r.estado!=='En curso'?'<span class="pill p-none">Hoy sin ronda</span>':''):'<span class="pill p-none">Sin rondas</span>')+(ph?'<span class="pill p-run">'+ph+' parte'+(ph>1?'s':'')+' hoy</span>':'')+'</span>'+
      '<span class="small muted num">'+(r?'Última: '+fD(r.inicio)+', '+fT(r.inicio)+' · '+esc(r.trabajador):'Ninguna ronda todavía')+'</span></button>'}).join('')+'</div>'
    :'<div class="card empty"><b>Aún no hay comunidades</b>Crea la primera aquí debajo.</div>')+
  '<details class="card" '+(OF.com.length?'':'open')+'><summary><b>Nueva comunidad</b></summary><form class="row" data-form="com" autocomplete="off" style="margin-top:12px">'+
    '<label class="f" style="flex:2 1 220px">Nombre<input type="text" id="cNom" placeholder="Ej. C/ Rigoberta Menchú 1"></label><label class="f">Localidad<input type="text" id="cLoc" placeholder="Ej. Parla"></label>'+
    '<label class="f" style="flex:0 1 120px">Prefijo<input type="text" id="cPre" placeholder="RIG1" maxlength="6" class="mono" style="text-transform:uppercase"></label><button class="btn pri" style="align-self:flex-end">Crear</button></form>'+
    '<p class="small muted" style="margin:8px 0 0">El prefijo identifica la comunidad en las etiquetas (RIG1-01, RIG1-02…). Al crearla se crea también su hoja de cálculo en Drive.</p></details>';
}
function listaRondas(list,mostrarCom){
  if(!list.length)return'<div class="empty"><b>No hay rondas</b>Se crean solas cuando se escanea el primer punto.</div>';
  return'<div class="list">'+list.map(function(r){var o=S.open[r.id],det='';
    if(o){var read={};lectOf(r.id).forEach(function(l){read[l.puntoId]=l});
      det='<div class="detail"><table class="num">'+ptsOf(r.comunidadId,OF.pts).map(function(p){var l=read[p.id];return'<tr><td><span class="code">'+esc(p.codigo)+'</span></td><td>'+esc(p.nombre)+'</td><td style="text-align:right;white-space:nowrap;'+(l?'':'color:var(--pink);font-weight:600')+'">'+(l?fT(l.hora)+' · '+esc(l.metodo):'Sin leer')+'</td></tr>'}).join('')+'</table>'+
      (r.estado==='En curso'?'<div style="margin-top:8px"><button class="btn" data-act="cerrar" data-id="'+r.id+'">Cerrar ronda</button></div>':'')+'</div>'}
    return'<div class="li click" data-act="toggle" data-id="'+r.id+'" role="button" tabindex="0"><span class="t">'+esc(mostrarCom?r.comunidad:fD(r.inicio))+'</span><span>'+estadoPill(r)+'</span><span class="s num">'+(mostrarCom?fD(r.inicio)+' · ':'')+fT(r.inicio)+(r.fin?'–'+fT(r.fin):'')+' · '+esc(r.trabajador)+'</span>'+det+'</div>'}).join('')+'</div>';
}
function listaPartes(list,mostrarCom){
  if(!list.length)return'<div class="empty"><b>No hay partes</b>Los trabajadores los rellenan desde su móvil.</div>';
  return'<div class="list">'+list.map(function(p){var fotos=String(p.fotos||'').split('\n').filter(Boolean);
    return'<div class="li"><span class="t">'+esc(mostrarCom?p.comunidad:p.trabajador)+'</span><span class="small muted">'+fD(p.fecha)+'</span><span class="s num">'+(mostrarCom?esc(p.trabajador)+' · ':'')+esc(p.entrada||'—')+'–'+esc(p.salida||'—')+(p.horas?' · '+String(p.horas).replace('.',',')+' h':'')+'</span>'+
      '<div style="grid-column:1/-1" class="stack">'+(p.tareas?'<div class="row" style="gap:4px">'+tareasLista(p.tareas).map(function(t){return'<span class="chip">'+esc(t)+'</span>'}).join('')+'</div>':'')+
      (p.observaciones?'<div class="banner b-info">'+esc(p.observaciones)+'</div>':'')+
      (fotos.length?'<div class="row small">'+fotos.map(function(u,i){return'<a href="'+esc(u)+'" target="_blank" rel="noopener">Foto '+(i+1)+'</a>'}).join('')+'</div>':'')+'</div></div>'}).join('')+'</div>';
}
function fotosLinks(f){var l=String(f||'').split('\n').filter(Boolean);return l.length?'<div class="row small">'+l.map(function(u,i){return'<a href="'+esc(u)+'" target="_blank" rel="noopener">Foto '+(i+1)+'</a>'}).join('')+'</div>':''}
function listaVisitas(list){
  if(!list.length)return'<div class="empty"><b>No hay visitas anotadas</b>El trabajador las anota desde su móvil: ascensores, grupo de presión, reformas…</div>';
  return'<div class="list">'+list.map(function(x){return'<div class="li"><span class="t">'+esc(x.tipo)+(x.empresa?' · '+esc(x.empresa):'')+'</span><span class="small muted num">'+fD(x.fecha)+(x.hora?' '+esc(x.hora):'')+'</span>'+

function filasPegadas(txt,minCols){
  var l=String(txt||'').split(/\r?\n/).map(function(x){return x.replace(/\s+$/,'')}).filter(function(x){return x.trim()});
  var out=l.map(function(x){var c=x.indexOf('\t')>=0?x.split('\t'):x.split(';');
    if(c.length>minCols&&x.indexOf('\t')<0)c=c.slice(0,minCols-1).concat([c.slice(minCols-1).join(';')]);
    return c.map(function(v){return v.trim().replace(/^"(.*)"$/,'$1').trim()})});
  if(out.length&&/^(nombre|comunidad|trabajador|direcci)/i.test(out[0][0]||''))out.shift();   // fila de títulos
  return out}

function render(skip){
  var vals={};document.querySelectorAll('#app input[id],#app select[id],#app textarea[id]').forEach(function(el){if(el.type==='file'||(skip&&el.id.indexOf(skip)===0))return;vals[el.id]=el.type==='checkbox'?el.checked:el.value});
  var a=document.activeElement,fid=a&&a.id,ss=null,se=null;try{ss=a.selectionStart;se=a.selectionEnd}catch(e){}
  var tr=document.getElementById('topRight'),tb=document.getElementById('tabBox');
  tr.innerHTML=S.view==='portal'?'<button class="btn ghost small" data-act="salirCli">Salir</button>':S.view==='trab'&&SES?'<button class="btn ghost small" data-act="salir">'+esc(SES.nombre)+' · Salir</button>':S.view==='ofi'?'<button class="btn ghost small" data-act="salirOfi">Salir de oficina</button>':'';
  document.getElementById('sub').textContent=S.view==='ofi'?'Oficina':S.view==='portal'||S.view==='cliLogin'?'Área de clientes':'Rondas y partes de trabajo';
  tb.hidden=S.view!=='ofi';
  if(S.view==='ofi')tb.innerHTML='<nav class="tabs">'+[['comunidades','Comunidades'],['equipo','Equipo'],['clientes','Clientes'],['importar','Alta masiva']].map(function(x){return'<button data-act="tab" data-v="'+x[0]+'" '+(S.tab===x[0]?'aria-current="page"':'')+'>'+x[1]+'</button>'}).join('')+'</nav>';
  app.innerHTML=S.view==='portal'?vPortal():S.view==='cliLogin'?vCliLogin():S.view==='login'?vLogin():S.view==='trab'?vTrab():S.view==='ofiLogin'?vOfiLogin():vOfi();
  Object.keys(vals).forEach(function(id){var el=document.getElementById(id);if(!el)return;if(el.type==='checkbox')el.checked=vals[id];else el.value=vals[id]});
  if(fid){var el=document.getElementById(fid);if(el&&el!==document.activeElement){el.focus({preventScroll:true});try{if(ss!=null)el.setSelectionRange(ss,se)}catch(e){}}}
}

  imBorrar:function(){S.imp=null;S.impHecho=false;var c=document.getElementById('imC'),t=document.getElementById('imT');if(c)c.value='';if(t)t.value='';render('im')},
  imCopiar:function(d,b){var t=accesosTxt(S.imp),done=function(){toast('Accesos copiados: pégalos en una hoja de Excel','ok')};try{navigator.clipboard.writeText(t).then(done,function(){selectNear(b)})}catch(e){selectNear(b)}}
};
function selectNear(b){var u=b.parentNode.querySelector('.u');if(u){var r=document.createRange();r.selectNodeContents(u);var s=getSelection();s.removeAllRanges();s.addRange(r);toast('Enlace seleccionado: cópialo con el menú del móvil.')}}
function confirmar(act,id,fn){var k=act+':'+id;if(S.confirm!==k){S.confirm=k;render();setTimeout(function(){if(S.confirm===k){S.confirm=null;render()}},4000);return}S.confirm=null;fn()}
function hojaEtiquetas(cid){
  if(!window.qrcode){toast('No se ha podido cargar el generador de QR.','bad');return}
  var c=OF.com.find(function(x){return x.id===cid}),pts=ptsOf(cid,OF.pts),cols=3,W=1240,cw=W/cols,ch=470,rows=Math.ceil(pts.length/cols);
  var cv=document.createElement('canvas');cv.width=W;cv.height=Math.max(1,rows)*ch;var g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);
  pts.forEach(function(p,i){var x=(i%cols)*cw,y=Math.floor(i/cols)*ch;g.setLineDash([8,8]);g.strokeStyle='#bbb';g.strokeRect(x+6,y+6,cw-12,ch-12);g.setLineDash([]);
    var q=qrcode(0,'M');q.addData(linkFor(p));q.make();var n=q.getModuleCount(),s=Math.floor(280/n),qs=s*n,qx=x+(cw-qs)/2,qy=y+40;g.fillStyle='#000';
    for(var r=0;r<n;r++)for(var k=0;k<n;k++)if(q.isDark(r,k))g.fillRect(qx+k*s,qy+r*s,s,s);
    g.textAlign='center';g.fillStyle='#29166F';g.font='bold 30px Arial, sans-serif';g.fillText(p.codigo,x+cw/2,qy+qs+48);
    g.fillStyle='#000';g.font='22px Arial, sans-serif';g.fillText(String(p.nombre).slice(0,34),x+cw/2,qy+qs+82);
    g.fillStyle='#DD127B';g.font='bold 18px Arial, sans-serif';g.fillText(String(c.nombre).slice(0,38)+' · J&M',x+cw/2,qy+qs+112)});
  S.busy=true;render();
  call('guardarEtiquetas',{admin:true,pin:ADM},cid,cv.toDataURL('image/png')).then(function(u){S.etiq[cid]=u;S.busy=false;render();toast('Hoja guardada en tu Drive','ok')})
    .catch(function(e){S.busy=false;render();toast(appMsg(e)||'Sin conexión.','bad')});
}
function comprimir(file){return new Promise(function(res,rej){var img=new Image(),u=URL.createObjectURL(file);
  img.onload=function(){var k=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.7))};
  img.onerror=function(){URL.revokeObjectURL(u);rej()};img.src=u})}
function reciente(k,fecha,cid,texto){B.recientes=[{k:k,fecha:fecha,comunidad:comName(cid),texto:texto}].concat(B.recientes||[]).slice(0,5);jset('jm_boot',B)}
function guardarOtro(kind,d,texto,k){OUT.otros.push({kind:kind,data:d});saveOut();reciente(k,d.fecha,d.comunidadId,texto);
  S.form=null;S.fotos=[];S.pCom=null;render(kind==='visita'?'v':'i');arriba();
  flush().then(function(ok){toast(ok?k+(k==='Incidencia'||k==='Visita'?' guardada':' guardado'):'Sin cobertura: queda guardado en el móvil y se enviará al volver la señal.',ok?'ok':'')})}
function v(id){var el=document.getElementById(id);return el?String(el.value||'').trim():''}
var F={
  dni:function(){var d=v('dniIn').toUpperCase().replace(/[^A-Z0-9]/g,'');if(d.length<8){toast('Escribe tu DNI o NIE completo.','bad');return}S.dni=d;S.paso='pin';S.pin='';render()},
  code:function(){var c=v('codeIn');if(!c)return;scan(c,'codigo');render('codeIn')},
  parte:function(){if(S.busy)return;var cid=v('pCom'),fecha=v('pFecha');if(!cid||!fecha){toast('Elige comunidad y fecha.','bad');return}
    var p={id:newId(),comunidadId:cid,fecha:fecha,entrada:v('pIn'),salida:v('pOut'),tareas:tareasDe(cid).filter(function(t,i){var el=document.getElementById('pT'+i);return el&&el.checked}),obs:v('pObs'),fotos:S.fotos.slice(),rondaId:RON&&RON.comunidadId===cid?RON.id:''};
    OUT.partes.push(p);saveOut();
    reciente('Parte',p.fecha,cid,p.tareas.join(', ')||'Sin tareas marcadas');
    S.form=null;S.fotos=[];S.pCom=null;render('p');
    flush().then(function(ok){toast(ok?'Parte enviado':'Sin cobertura: el parte queda guardado en el móvil y se enviará al volver la señal.',ok?'ok':'')})},
  visita:function(){if(S.busy)return;var cid=v('pCom'),fecha=v('vFecha');if(!cid||!fecha){toast('Elige comunidad y fecha.','bad');return}
    if(!v('vEmp')&&!v('vMot')){toast('Escribe quién ha venido o qué han hecho.','bad');return}
    var d={id:newId(),comunidadId:cid,fecha:fecha,hora:v('vHora'),tipo:v('vTipo'),empresa:v('vEmp'),motivo:v('vMot'),lugar:v('vLug'),fotos:S.fotos.slice()};
    guardarOtro('visita',d,d.tipo+(d.empresa?' · '+d.empresa:''),'Visita')},
  incidencia:function(){if(S.busy)return;var cid=v('pCom'),fecha=v('iFecha');if(!cid||!fecha){toast('Elige comunidad y fecha.','bad');return}
    if(!v('iInc')){toast('Escribe qué ha pasado.','bad');return}
    if(S.iMat&&!v('iMatD')){toast('Escribe qué material se ha cambiado o comprado.','bad');return}
    var d={id:newId(),comunidadId:cid,fecha:fecha,hora:v('iHora'),lugar:v('iLug'),incidencia:v('iInc'),estado:v('iEst'),material:!!S.iMat,materialDesc:S.iMat?v('iMatD'):'',cantidad:S.iMat?(v('iCant')||'1'):'',fotos:S.fotos.slice()};
    guardarOtro('incidencia',d,d.incidencia+' · '+d.estado,'Incidencia')},
  ofi:function(){var pin=v('ofiPin');if(!pin)return;S.busy=true;render();
    call('entrarOficina',{admin:true,pin:pin},APPURL).then(function(d){ADM=pin;try{sessionStorage.setItem('jm_adm',pin)}catch(e){}OF=d;S.view='ofi';S.busy=false;render('ofi')})
    .catch(function(e){S.busy=false;render('ofi');toast(appMsg(e)||'Sin conexión.','bad')})},
  com:function(){adm('crearComunidad',{nombre:v('cNom'),localidad:v('cLoc'),prefijo:v('cPre')}).then(function(ok){if(ok){render('c');toast('Comunidad creada con su hoja de cálculo','ok')}})},
  pt:function(f){var cid=f.dataset.id;if(!v('np-'+cid))return;adm('crearPunto',{comunidadId:cid,nombre:v('np-'+cid)}).then(function(ok){if(ok)render('np-'+cid)})},
  trab:function(){if(!v('tNom'))return;var asg=OF.com.length?leerAsig('ac-'):[];adm('crearTrabajador',{nombre:v('tNom'),dni:v('tDni'),telefono:v('tTel'),comunidades:asg}).then(function(ok){if(ok){render('t');toast('Trabajador dado de alta','ok')}})},
  tarea:function(f){var id=f.dataset.id,c=OF.com.find(function(x){return x.id===id}),n=v('nt-'+id);if(!c||!n)return;
    if(c.tareasLista.some(function(x){return x.toLowerCase()===n.toLowerCase()})){toast('Esa tarea ya está en la lista.','bad');return}
    adm('guardarTareas',id,c.tareasLista.concat([n])).then(function(ok){if(ok){render('nt-');toast('Tarea añadida','ok')}})},
  asig:function(f){var id=f.dataset.id,asg=leerAsig('dc-'+id+'-');adm('cambiarTrabajador',{id:id,comunidades:asg}).then(function(ok){if(ok)toast(asg==='*'?'Asignadas todas las comunidades':asg.length?'Comunidades guardadas':'Sin comunidades: no podrá registrar nada',asg==='*'||asg.length?'ok':'')})},
  cliLogin:function(){var m=v('cliMov'),pin=v('cliPin');if(!m||!/^\d{4}$/.test(pin)){toast('Escribe tu móvil y tu PIN de 4 cifras.','bad');return}S.busy=true;render();
    call('clienteEntrar',{movil:m,pin:pin}).then(function(r){S.busy=false;CLIENTE=r.token;try{localStorage.setItem('jm_cliente',r.token)}catch(e){}iniciarPortal()})
    .catch(function(e){S.busy=false;render('cliPin');toast(appMsg(e)||'Sin conexión.','bad')})},
  cli:function(){var n=v('clNom');if(!n){toast('Escribe el nombre del cliente.','bad');return}var perm=leerPerm('pn-');
    adm('crearCliente',{nombre:n,tipo:v('clTipo'),contacto:v('clCon'),permisos:perm}).then(function(ok){if(ok){var l=OF.clientes;S.cliSel=l[l.length-1].id;render('cl');arriba();toast('Acceso creado. Envíale su enlace.','ok')}})},
  perm:function(f){var id=f.dataset.id;adm('cambiarCliente',{id:id,permisos:leerPerm('pe-'+id+'-')}).then(function(ok){if(ok)toast('Permisos guardados','ok')})},
  dni2:function(f){var id=f.dataset.id;adm('cambiarTrabajador',{id:id,dni:v('dniEd-'+id)}).then(function(ok){if(ok)toast('DNI guardado','ok')})}
};
document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b||b.disabled)return;if(e.target.closest('.detail')&&b.dataset.act==='toggle')return;e.preventDefault();if(A[b.dataset.act])A[b.dataset.act](b.dataset,b)});
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.li.click')){e.preventDefault();var d=e.target.dataset;if(A[d.act])A[d.act](d)}});
document.addEventListener('submit',function(e){var f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();if(F[f.dataset.form])F[f.dataset.form](f)});
document.addEventListener('change',function(e){var t=e.target;
  if(t.id==='pCom'){S.pCom=t.value;render('pT');return}
  if((t.id==='pDia'||t.id==='oDia')&&t.value){var r=rangoDe('dia',t.value);if(t.id==='pDia'){S.pR=r;S.pCargando=true;render();cargarPortal()}else{S.oR=r;cargarDet()}return}
  if(t.id==='iMat'){S.iMat=t.checked;render();return}
  if(t.id==='pFotos'){var files=[].slice.call(t.files).slice(0,4-S.fotos.length);Promise.all(files.map(comprimir)).then(function(l){S.fotos=S.fotos.concat(l).slice(0,4);render()}).catch(function(){toast('No se ha podido leer una foto.','bad')})}});

window.addEventListener('offline',function(){S.offline=true;render()});
window.addEventListener('online',function(){S.offline=false;render();if(pendientes())flush().then(function(ok){if(ok)toast('Señal recuperada: registros enviados','ok')})});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&pendientes())flush()});
setInterval(function(){if(pendientes()&&!S.offline)flush()},20000);
if(CLIENTE&&!SES)S.view='portal';
if(S.view!=='portal')cierreOlvido();
render();
if(S.view==='portal')iniciarPortal();
if(S.view!=='portal'&&SES&&B&&S.pending){var c0=S.pending;S.pending=null;scan(c0,'enlace')}
if(S.view!=='portal'&&SES){refrescar()}
if(S.view!=='portal'&&ADM&&!SES){call('entrarOficina',{admin:true,pin:ADM}).then(function(d){OF=d;S.view='ofi';render()}).catch(function(){})}
